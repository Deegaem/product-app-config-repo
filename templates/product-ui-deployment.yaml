apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-ui-deployment
  namespace: product-app
spec:
  selector:
    matchLabels:
      app: product-ui
  replicas: 1 
  template:
    metadata:
      labels:
        app: product-ui
    spec:
      containers:
      - name: product-ui
        image: deegaem/product-app-ui:1.0.7
        ports:
        - containerPort: 80 