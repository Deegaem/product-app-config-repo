apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-ui-deployment
  namespace: product
spec:
  selector:
    matchLabels:
      app: product-ui
  replicas: 2 
  template:
    metadata:
      labels:
        app: product-ui
    spec:
      containers:
      - name: product-ui
        image: product-app.ui:1.0 
        ports:
        - containerPort: 80 