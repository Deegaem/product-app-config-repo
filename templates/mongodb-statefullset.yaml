apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: product-app
spec:
  selector:
    matchLabels:
      app: mongodb
  serviceName: mongodb
  replicas: 1
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:latest
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: csi-pvc
          mountPath: /data/db
        env:
          - name: "MONGO_INITDB_ROOT_USERNAME"
            valueFrom:
              configMapKeyRef:
                name: mongodb-configmap
                key: DB_USER
          - name: "MONGO_INITDB_ROOT_PASSWORD"
            valueFrom:
              secretKeyRef:
                name: mongodb-secret
                key: DB_PASSWORD              
  volumeClaimTemplates:
  - metadata:
      name: csi-pvc
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
      storageClassName: do-block-storage