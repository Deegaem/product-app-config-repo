apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-api-deployment
  namespace: product-app
spec:
  selector:
    matchLabels:
      app: product-api
  replicas: 1 
  template:
    metadata:
      labels:
        app: product-api
    spec:
      containers:
      - name: product-api
        image: deegaem/product-api:1.2.4
        ports:
        - containerPort: 8080
        env:
            - name: SPRING_MONGODB_URI
              valueFrom :
                secretKeyRef :
                  name : mongodb-secret
                  key :  MONGODB_URI

            # - name: DB_NAME
            #   valueFrom :
            #     configMapKeyRef :
            #       name : mongodb-configmap
            #       key :  db_Name