apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-api-deployment
  namespace: product-app
spec:
  selector:
    matchLabels:
      app: product-api
  replicas: 1 
  template:
    metadata:
      labels:
        app: product-api
    spec:
      containers:
      - name: product-api
        image: deegaem/product-api:1.0.11
        ports:
        - containerPort: 8080
        env:
            - name: DB_HOST
              valueFrom :
                configMapKeyRef :
                  name : mongodb-configMap
                  key :  db_Host

            - name: DB_NAME
              valueFrom :
                configMapKeyRef :
                  name : mongodb-configMap
                  key :  db_Name